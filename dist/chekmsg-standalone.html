<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!--
  จำกัดปลายทางที่หน้านี้ติดต่อได้ ให้เหลือเท่าที่ใช้จริง
  ผู้ใช้วาง SMS ธนาคารลงในหน้านี้ ถ้ามีสคริปต์แปลกปลอมเข้ามาได้ CSP คือด่านที่กันไม่ให้ส่งข้อมูลออก

  ตั้ง OCR.proxyUrl เป็นโดเมนอื่นเมื่อไร ต้องเติมโดเมนนั้นใน connect-src ด้วย ไม่งั้น OCR จะพัง
  frame-ancestors ใส่ใน meta ไม่มีผล ถ้าอยากกัน clickjacking ต้องตั้งเป็น header ที่ nginx
-->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' blob: https://cdn.jsdelivr.net;
  worker-src blob:;
  style-src 'self' 'unsafe-inline';
  img-src 'self' data: blob:;
  connect-src 'self' https://cdn.jsdelivr.net https://tessdata.projectnaptha.com;
  form-action 'none';
  base-uri 'none';
  object-src 'none'">
<title>ChekMsg — Banking Fraud Screener (standalone)</title>
<style>
  :root{
    --ink:#1b1f23; --paper:#faf7f2; --paper2:#f2ede3;
    --line:#1b1f23; --alert:#b23a2e; --alert-bg:#fbeceb;
    --safe:#2f6b4f; --safe-bg:#eaf3ee; --unsure:#a67c1f; --unsure-bg:#faf3e3;
    --accent:#1b3a5c; --muted:#6b6660; --hair:#d8d0c4;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper);
    background-image:radial-gradient(circle at 1px 1px, rgba(27,31,35,0.05) 1px, transparent 0);
    background-size:22px 22px;
    font-family:'Courier New', ui-monospace, monospace;
    color:var(--ink); padding:28px 16px 60px;
  }
  .wrap{max-width:680px;margin:0 auto;}
  .brand{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid var(--line);padding-bottom:14px;margin-bottom:4px;}
  .brand-left h1{font-family:Georgia,'Times New Roman',serif;font-size:34px;letter-spacing:-0.5px;margin:0;line-height:1;}
  .brand-left .sub{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin-top:6px;}
  .brand-right{text-align:right;font-size:11px;color:var(--muted);line-height:1.7;}
  .badge{display:inline-block;background:var(--ink);color:var(--paper);font-size:9px;letter-spacing:1px;padding:2px 7px;text-transform:uppercase;}
  .tag{font-size:13px;color:var(--muted);margin:16px 0 10px;line-height:1.6;}
  .privacy{font-size:11.5px;color:var(--safe);border:1px solid var(--safe);background:var(--safe-bg);padding:8px 11px;margin-bottom:22px;line-height:1.5;}

  .lang-toggle{display:flex;margin-bottom:20px;border:2px solid var(--line);width:fit-content;}
  .lang-toggle button{background:var(--paper);border:none;padding:6px 16px;font-family:inherit;font-size:11px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;color:var(--ink);}
  .lang-toggle button[aria-pressed="true"]{background:var(--ink);color:var(--paper);}

  .field label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:8px;font-weight:bold;}
  textarea{width:100%;min-height:130px;padding:16px;border:2px solid var(--line);background:#fff;font-family:inherit;font-size:15px;color:var(--ink);resize:vertical;line-height:1.5;}
  textarea:focus{outline:none;border-color:var(--accent);box-shadow:3px 3px 0 rgba(27,58,92,0.15);}
  .char-count{font-size:10px;color:var(--muted);text-align:right;margin-top:4px;}

  /* ocr */
  .ocr{margin-top:12px;border:2px dashed var(--line);padding:14px;background:rgba(255,255,255,0.4);transition:background .15s ease;}
  .ocr.drag{background:var(--paper2);border-color:var(--accent);}
  .ocr-head{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:bold;margin-bottom:6px;}
  .ocr-hint{font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:10px;}
  .ocr-btn{background:var(--paper2);border:1.5px solid var(--line);padding:8px 14px;font-family:inherit;font-size:12px;cursor:pointer;color:var(--ink);}
  .ocr-btn:hover{background:var(--ink);color:var(--paper);}
  .ocr-btn:disabled{opacity:.5;cursor:default;}
  .ocr-status{margin-top:10px;font-size:12px;color:var(--accent);line-height:1.6;}
  .ocr-status.err{color:var(--alert);}
  .ocr-bar{height:6px;background:rgba(0,0,0,0.08);border:1px solid var(--line);margin-top:6px;display:none;}
  .ocr-bar span{display:block;height:100%;background:var(--accent);width:0;transition:width .2s ease;}
  .ocr-note{margin-top:10px;font-size:11.5px;background:var(--unsure-bg);border-left:3px solid var(--unsure);padding:8px 11px;line-height:1.6;display:none;}

  .examples{margin:14px 0 22px;}
  .examples .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;}
  .examples .btn-row{display:flex;flex-wrap:wrap;gap:6px;}
  .examples button{background:var(--paper2);border:1px solid var(--line);border-radius:20px;padding:6px 13px;font-size:11px;cursor:pointer;font-family:inherit;color:var(--ink);transition:all .15s ease;}
  .examples button:hover{background:var(--ink);color:var(--paper);}

  .action-row{display:flex;gap:10px;margin-top:6px;}
  .check-btn{flex:1;padding:16px;background:var(--ink);color:var(--paper);border:none;font-family:inherit;font-size:15px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;}
  .check-btn:hover{background:var(--accent);}
  .clear-btn{padding:16px 20px;background:transparent;color:var(--ink);border:2px solid var(--line);font-family:inherit;font-size:13px;text-transform:uppercase;letter-spacing:1px;cursor:pointer;}

  #result{margin-top:26px;}
  .verdict{border:3px solid var(--line);padding:22px;box-shadow:5px 5px 0 rgba(27,31,35,0.08);}
  .verdict.scam{border-color:var(--alert);background:var(--alert-bg);}
  .verdict.legit{border-color:var(--safe);background:var(--safe-bg);}
  .verdict.unsure{border-color:var(--unsure);background:var(--unsure-bg);}
  .verdict-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
  .verdict h2{margin:0 0 8px;font-family:Georgia,serif;font-size:23px;}
  .verdict.scam h2{color:var(--alert);} .verdict.legit h2{color:var(--safe);} .verdict.unsure h2{color:var(--unsure);}
  .verdict p{margin:6px 0;font-size:13.5px;line-height:1.6;}
  .risk-chip{font-size:10px;text-transform:uppercase;letter-spacing:1px;font-weight:bold;padding:4px 10px;border:1.5px solid currentColor;white-space:nowrap;}
  .verdict.scam .risk-chip{color:var(--alert);} .verdict.legit .risk-chip{color:var(--safe);} .verdict.unsure .risk-chip{color:var(--unsure);}
  .flags{margin-top:14px;font-size:12px;color:var(--muted);padding-top:12px;border-top:1px dashed var(--hair);}
  .flags b{color:var(--ink);display:block;margin-bottom:4px;}
  .flag-pill{display:inline-block;background:rgba(255,255,255,0.6);border:1px solid currentColor;border-radius:12px;padding:2px 9px;margin:2px 4px 2px 0;font-size:11px;}
  .strength{margin-top:16px;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);}
  .strength .dots{display:inline-block;margin-left:8px;letter-spacing:3px;font-size:14px;color:var(--ink);}
  .action-tip{margin-top:14px;font-size:12px;background:rgba(255,255,255,0.55);border-left:3px solid currentColor;padding:8px 12px;line-height:1.6;}
  .report-wrong{margin-top:12px;font-size:11px;}
  .report-wrong a{color:var(--accent);}

  .history{margin-top:30px;}
  .history .label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:10px;font-weight:bold;}
  .history-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--hair);font-size:12px;}
  .history-item .msg-preview{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .history-tag{font-size:9px;text-transform:uppercase;letter-spacing:0.5px;padding:2px 7px;border-radius:10px;font-weight:bold;white-space:nowrap;}
  .history-tag.scam{background:var(--alert-bg);color:var(--alert);}
  .history-tag.legit{background:var(--safe-bg);color:var(--safe);}
  .history-tag.unsure{background:var(--unsure-bg);color:var(--unsure);}
  .empty-history{font-size:12px;color:var(--muted);font-style:italic;}

  details.howworks{margin-top:30px;border-top:1px solid var(--hair);padding-top:16px;}
  details.howworks summary{cursor:pointer;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--accent);font-weight:bold;}
  details.howworks .content{font-size:12.5px;line-height:1.7;margin-top:12px;}
  details.howworks .content ol{padding-left:18px;margin:8px 0;}
  .caveat{margin-top:14px;padding:10px 12px;background:var(--unsure-bg);border-left:3px solid var(--unsure);font-size:12px;line-height:1.6;}

  .stat-strip{display:flex;justify-content:space-between;margin-top:40px;border-top:1px solid var(--line);padding-top:14px;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;flex-wrap:wrap;gap:6px;}
  .loaderr{border:2px solid var(--alert);background:var(--alert-bg);color:var(--alert);padding:14px;font-size:12.5px;line-height:1.6;}
  @media (max-width:480px){ .brand{flex-direction:column;align-items:flex-start;gap:6px;} .brand-right{text-align:left;} .action-row{flex-direction:column;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="brand-left">
      <h1>ChekMsg</h1>
      <div class="sub">Banking Fraud Screener</div>
    </div>
    <div class="brand-right">
      <span class="badge" id="buildBadge">v0.4</span><br>
      Thailand · EN / TH
    </div>
  </div>

  <div class="tag" id="tagline"></div>
  <div class="privacy" id="privacyNote"></div>

  <div class="lang-toggle" role="group" aria-label="Language">
    <button id="btnEn" aria-pressed="true">English</button>
    <button id="btnTh" aria-pressed="false">ไทย</button>
  </div>

  <div class="field">
    <label id="inputLabel" for="msgInput"></label>
    <textarea id="msgInput"></textarea>
    <div class="char-count"><span id="charCount">0</span> <span id="charWord"></span></div>
  </div>

  <div class="ocr" id="ocrZone">
    <div class="ocr-head" id="ocrHead"></div>
    <div class="ocr-hint" id="ocrHint"></div>
    <button class="ocr-btn" id="ocrPick"></button>
    <input type="file" id="ocrFile" accept="image/*" style="display:none">
    <div class="ocr-bar" id="ocrBar"><span id="ocrFill"></span></div>
    <div class="ocr-status" id="ocrStatus"></div>
    <div class="ocr-note" id="ocrNote"></div>
  </div>

  <div class="examples">
    <div class="label" id="tryLabel"></div>
    <div class="btn-row" id="exampleRow"></div>
  </div>

  <div class="action-row">
    <button class="check-btn" id="checkBtn"></button>
    <button class="clear-btn" id="clearBtn"></button>
  </div>

  <div id="result" role="status" aria-live="polite"></div>

  <div class="history">
    <div class="label" id="historyLabel"></div>
    <div id="historyList"></div>
  </div>

  <details class="howworks">
    <summary id="howSummary"></summary>
    <div class="content" id="howContent"></div>
  </details>

  <div class="stat-strip">
    <span id="statBuild"></span>
    <span id="statPatterns"></span>
    <span id="statUpdated"></span>
  </div>
</div>

<script>
(async function(){

/* ===== inlined engine.js ===== */
/**
 * ChekMsg detection engine v0.5
 *
 * ทำงานได้ทั้งในเบราว์เซอร์และ Node (ES module)
 * ตัว engine ไม่รู้จักภาษาที่จะแสดงผล — คืนค่าเป็น "รหัส" ให้ชั้น UI แปลเอง
 * เพื่อให้เพิ่มภาษาได้โดยไม่ต้องแตะ logic
 *
 * โครงจาก v0.4:
 *   1. pattern อยู่ใน patterns.json ไม่ปนกับโค้ด
 *   2. รู้จักการปฏิเสธ — "ห้ามบอก OTP" ไม่ถูกนับเป็นสัญญาณสแกม
 *   3. นับสูงสุด 1 ครั้งต่อหมวด กันคะแนนเฟ้อจาก pattern ที่ซ้อนกัน
 *   4. ตัดสินด้วยส่วนต่างคะแนน ไม่ใช่คำเดียวชนะ
 *   5. ตรวจโดเมนของลิงก์เทียบ allowlist ของธนาคาร/หน่วยงานรัฐ
 *   6. คืน "ความแรงของสัญญาณ" แทน % ความมั่นใจปลอม
 *
 * สิ่งที่ v0.5 แก้ — ทั้งสามข้อพิสูจน์ด้วยชุดทดสอบ `evasion` ใน tests/testset.json:
 *   7. ปิดช่องยัดคำปฏิเสธ ที่เคยล้างสัญญาณสแกมทั้งข้อความจนตอบว่า legit
 *      (จำกัดหมวดที่ปฏิเสธได้ + ตรวจจับการพูดคำปฏิเสธซ้ำหลายจุด)
 *   8. เลิกตีชื่อไฟล์และประโยคที่ช่องว่างหลังจุดหายว่าเป็นโดเมนแปลกปลอม
 *   9. ตัดอักขระล่องหน (zero-width, ขึ้นบรรทัดใหม่) ก่อนเทียบ keyword ไม่ใช่แค่ช่องว่าง
 */

/**
 * group 1 = scheme, 2 = host, 3 = tld, 4 = path
 * ตัวจับอย่างเดียวยังไม่พอ — ข้อความปกติมีคำติดกันด้วยจุดเยอะ ("statement.pdf",
 * "Payment received.Thank you" ที่ช่องว่างหายจาก OCR) ตัวกรองอยู่ใน isRealLink()
 */
const URL_RE = /(https?:\/\/)?((?:[a-z0-9-]+\.)+([a-z]{2,24}))(\/[^\s]*)?/gi;

/** อักขระที่ต้องลบทิ้งก่อนเทียบ keyword — ช่องว่างทุกชนิด + อักขระล่องหน */
const BLANK_RE = /[\s\u00ad\u200b-\u200f\u2060]/;
const BLANK_G = /[\s\u00ad\u200b-\u200f\u2060]/g;

function createEngine(patterns) {
  const {
    thresholds, negations, negationWindow, categories,
    negatableCats, negationGuard = {},
    scam = [], legit = [], risk = [], linkCheck = {}
  } = patterns;

  const compiledRisk = risk.map(r => ({ ...r, re: new RegExp(r.regex, r.flags || '') }));
  const trusted = new Set((linkCheck.trustedDomains || []).map(d => d.toLowerCase()));
  const bankMentions = (linkCheck.bankMentions || []).map(m => m.toLowerCase());
  const tldAllow = new Set((linkCheck.tldAllow || []).map(d => d.toLowerCase()));
  const fileExtDeny = new Set((linkCheck.fileExtDeny || []).map(d => d.toLowerCase()));
  const allNegations = [...(negations.en || []), ...(negations.th || [])];
  // ไม่ระบุ = ให้ปฏิเสธได้ทุกหมวดเหมือน v0.4 (แต่ patterns.json ปัจจุบันระบุไว้แล้ว)
  const canNegate = negatableCats ? new Set(negatableCats) : null;
  const negSpamAt = negationGuard.threshold || 3;
  const negSpamW = negationGuard.w || 3;

  /** ข้อความก่อนหน้าตำแหน่งที่ match มีคำปฏิเสธหรือไม่ */
  function isNegated(lowerText, matchIndex, lang) {
    const win = (negationWindow && negationWindow[lang]) || 30;
    const before = lowerText.slice(Math.max(0, matchIndex - win), matchIndex);
    return allNegations.some(n => before.includes(n));
  }

  /**
   * นับ "กลุ่ม" ของคำปฏิเสธในข้อความ โดยรวมช่วงที่ทับกันให้เหลือครั้งเดียว
   * ("we will never" นับ 1 ไม่ใช่ 2 จาก "will never" + "never")
   *
   * คำเตือนจริงของธนาคารใช้คำปฏิเสธชุดเดียวคลุมหลายเรื่อง ส่วนการยัดคำปฏิเสธ
   * เพื่อล้างสัญญาณต้องพูดซ้ำหน้าทุกวลี จำนวนกลุ่มจึงแยกสองอย่างนี้ออกจากกันได้
   */
  function countNegationClusters(lowerText) {
    const spans = [];
    for (const n of allNegations) {
      let i = 0;
      while ((i = lowerText.indexOf(n, i)) !== -1) { spans.push([i, i + n.length]); i += 1; }
    }
    if (!spans.length) return 0;
    spans.sort((a, b) => a[0] - b[0]);
    let clusters = 1, end = spans[0][1];
    for (const [s, e] of spans.slice(1)) {
      if (s >= end) clusters++;
      if (e > end) end = e;
    }
    return clusters;
  }

  /** เหลือรายการที่น้ำหนักสูงสุดของแต่ละหมวด */
  function dedupeByCategory(hits) {
    const best = new Map();
    for (const h of hits) {
      const cur = best.get(h.cat);
      if (!cur || h.w > cur.w) best.set(h.cat, h);
    }
    return [...best.values()];
  }

  /**
   * "word.word" ไม่ได้แปลว่าเป็นลิงก์เสมอไป — ชื่อไฟล์ (statement.pdf) และประโยค
   * ที่ช่องว่างหลังจุดหายจาก OCR ("received.Thank") ก็หน้าตาเหมือนกัน
   * ถ้าไม่มี scheme / www. / path ให้เชื่อเฉพาะ TLD ที่อยู่ในรายการเท่านั้น
   */
  function isRealLink({ scheme, host, tld, path }) {
    if (scheme) return true;
    if (host.startsWith('www.')) return true;
    if (fileExtDeny.has(tld)) return false;
    if (path) return true;
    return tldAllow.has(tld);
  }

  function extractDomains(raw) {
    const out = [];
    URL_RE.lastIndex = 0;
    let m;
    while ((m = URL_RE.exec(raw)) !== null) {
      const host = m[2].toLowerCase();
      const tld = m[3].toLowerCase();
      if (!isRealLink({ scheme: m[1], host, tld, path: m[4] })) continue;
      // ตัด subdomain ให้เหลือ 2 ระดับสุดท้าย เว้นโดเมนไทยที่เป็น 3 ระดับ (co.th, or.th, go.th, ac.th, in.th)
      const parts = host.split('.');
      const isThreeLevelTh = parts.length > 2 && parts[parts.length - 1] === 'th' &&
        ['co', 'or', 'go', 'ac', 'in', 'net', 'mi'].includes(parts[parts.length - 2]);
      const registrable = isThreeLevelTh ? parts.slice(-3).join('.') : parts.slice(-2).join('.');
      out.push({ host, registrable });
    }
    return out;
  }

  /**
   * ลบช่องว่างและอักขระล่องหนออกทั้งหมด พร้อมเก็บ map กลับไปยังตำแหน่งเดิม
   * เพื่อรับมือเทคนิคหลบ keyword ด้วยการแทรกอะไรก็ตามที่มองไม่เห็น
   * เช่น "ก ด ลิ ง ก์", zero-width space กลางคำ, หรือขึ้นบรรทัดใหม่กลางคำ
   * (พบจริงในสแกมไทย — ดู note ใน README)
   */
  function despace(lowerText) {
    let out = '';
    const map = [];
    for (let i = 0; i < lowerText.length; i++) {
      const ch = lowerText[i];
      if (BLANK_RE.test(ch)) continue;
      out += ch;
      map.push(i);
    }
    return { text: out, map };
  }

  /** หา pattern ในข้อความ คืนตำแหน่งในข้อความต้นฉบับ หรือ -1 */
  function findMatch(lower, packed, needle) {
    const direct = lower.indexOf(needle);
    if (direct !== -1) return direct;
    const squeezed = needle.replace(BLANK_G, '');
    if (!squeezed) return -1;
    const idx = packed.text.indexOf(squeezed);
    return idx === -1 ? -1 : packed.map[idx];
  }

  function analyze(rawInput) {
    const raw = String(rawInput || '');
    const lower = raw.toLowerCase();
    const packed = despace(lower);

    const scamHits = [];
    const legitHits = [];
    let negatedCount = 0;

    /* คำเตือนจริงของธนาคารใช้คำปฏิเสธชุดเดียวคลุมทั้งข้อความ ถ้าเจอเป็นกลุ่ม ๆ
       หลายจุด แปลว่ากำลังถูกยัดคำปฏิเสธเพื่อล้างสัญญาณ ให้ปิดการปฏิเสธทั้งหมด
       แล้วนับความพยายามนั้นเป็นสัญญาณอันตรายแทน */
    const negationClusters = countNegationClusters(lower);
    const negationSpam = negationClusters >= negSpamAt;

    // --- keyword ฝั่งสแกม (ข้ามถ้าถูกปฏิเสธ) ---
    for (const p of scam) {
      const idx = findMatch(lower, packed, p.match.toLowerCase());
      if (idx === -1) continue;
      // ปฏิเสธได้เฉพาะหมวดที่ธนาคารเตือนจริง — ไม่มีธนาคารไหนเขียนว่า
      // "เราจะไม่ระงับบัญชีคุณ" ดังนั้นคำขู่ระงับบัญชีจึงปฏิเสธไม่ได้
      const negatable = !negationSpam && (!canNegate || canNegate.has(p.cat));
      if (negatable && isNegated(lower, idx, p.lang)) { negatedCount++; continue; }
      scamHits.push({ id: p.id, cat: p.cat, w: p.w, side: 'scam' });
    }

    // --- keyword ฝั่งข้อความปกติ ---
    for (const p of legit) {
      const idx = findMatch(lower, packed, p.match.toLowerCase());
      if (idx === -1) continue;
      legitHits.push({ id: p.id, cat: p.cat, w: p.w, side: 'legit' });
    }

    // ข้อความที่ "ห้ามบอกรหัส" คือคำเตือนของธนาคาร ไม่ใช่คำขอของคนร้าย
    if (negatedCount > 0 && !legitHits.some(h => h.cat === 'security_advice')) {
      legitHits.push({ id: 'l_derived_negation', cat: 'security_advice', w: 3, side: 'legit' });
    }

    // --- pattern เชิงโครงสร้าง ---
    const riskHits = [];
    for (const r of compiledRisk) {
      r.re.lastIndex = 0;
      if (r.re.test(raw)) riskHits.push({ id: r.id, cat: r.cat, w: r.w, side: 'risk' });
    }
    if (negationSpam) {
      riskHits.push({
        id: 'r_negation_spam', cat: 'negation_spam', w: negSpamW, side: 'risk',
        detail: negationClusters + ' clusters'
      });
    }

    // --- ตรวจโดเมนของลิงก์ ---
    const domains = extractDomains(raw);
    const untrusted = domains.filter(d => !trusted.has(d.registrable));
    const mentionsInstitution = bankMentions.some(m => lower.includes(m));
    if (linkCheck.enabled && untrusted.length && mentionsInstitution) {
      riskHits.push({
        id: 'r_untrusted_domain',
        cat: 'link_untrusted',
        w: linkCheck.weightUntrusted || 4,
        side: 'risk',
        detail: untrusted.map(d => d.registrable).join(', ')
      });
    }

    // --- รวมคะแนน (นับสูงสุด 1 ครั้งต่อหมวด) ---
    const scamFinal = dedupeByCategory([...scamHits, ...riskHits]);
    const legitFinal = dedupeByCategory(legitHits);
    const scamScore = scamFinal.reduce((s, h) => s + h.w, 0);
    const legitScore = legitFinal.reduce((s, h) => s + h.w, 0);
    const margin = scamScore - legitScore;

    // --- ตัดสินด้วยส่วนต่าง ไม่ใช่คำเดียวชนะ ---
    let verdict;
    if (margin >= thresholds.scamMargin) verdict = 'scam';
    else if (-margin >= thresholds.legitMargin) verdict = 'legit';
    else verdict = 'unsure';

    // --- ความแรงของสัญญาณ (ไม่ใช่ความน่าจะเป็น) ---
    const dominant = Math.max(scamScore, legitScore);
    let strength = 'low';
    if (dominant >= thresholds.strength.high) strength = 'high';
    else if (dominant >= thresholds.strength.medium) strength = 'medium';
    if (verdict === 'unsure') strength = 'low';

    return {
      verdict,
      strength,
      scamScore,
      legitScore,
      margin,
      negatedCount,
      negationClusters,
      negationSpam,
      scamSignals: scamFinal,
      legitSignals: legitFinal,
      domains: domains.map(d => d.registrable),
      untrustedDomains: untrusted.map(d => d.registrable),
      categoryLabel: (cat, lang) => (categories[cat] && categories[cat][lang]) || cat
    };
  }

  return { analyze, patterns };
}

/* ---------- i18n ---------- */
function applyLang() {
  const t = T[lang];
  // โหมด proxy ส่งภาพออกนอกเครื่องจริง ข้อความ privacy จึงต้องเปลี่ยนตาม
  // ไม่ใช่แค่ ocrNote — ปล่อยให้ข้อความหลักบอกว่า "ไม่ส่งไปที่ใด" คือการโกหกผู้ใช้
  const cloud = Boolean(OCR.proxyUrl);
  $('tagline').textContent = t.tagline;
  $('privacyNote').textContent = cloud ? t.privacyCloud : t.privacy;
  $('inputLabel').textContent = t.inputLabel;
  $('msgInput').placeholder = t.placeholder;
  $('charWord').textContent = t.charWord;
  $('tryLabel').textContent = t.tryLabel;
  $('checkBtn').textContent = t.check;
  $('clearBtn').textContent = t.clear;
  $('historyLabel').textContent = t.historyLabel;
  $('howSummary').textContent = t.howSummary;
  $('btnEn').setAttribute('aria-pressed', String(lang === 'en'));
  $('btnTh').setAttribute('aria-pressed', String(lang === 'th'));
  document.documentElement.lang = lang;

  const how = $('howContent');
  how.innerHTML = '';
  const ol = document.createElement('ol');
  t.how.forEach(line => { const li = document.createElement('li'); li.textContent = line; ol.appendChild(li); });
  how.appendChild(ol);
  const cav = document.createElement('div');
  cav.className = 'caveat';
  cav.textContent = t.caveat;
  how.appendChild(cav);

  $('ocrHead').textContent = t.ocrHead;
  $('ocrHint').textContent = cloud ? t.ocrHintCloud : t.ocrHint;
  $('ocrPick').textContent = t.ocrPick;
  $('ocrNote').textContent = cloud ? t.ocrPrivacyCloud : t.ocrNote;

  const row = $('exampleRow');
  row.innerHTML = '';
  EXAMPLES.forEach(ex => {
    const b = document.createElement('button');
    b.textContent = ex[lang] || ex.en;
    b.addEventListener('click', () => { $('msgInput').value = ex.text; updateCount(); });
    row.appendChild(b);
  });

  renderHistory();
}

function updateCount() { $('charCount').textContent = $('msgInput').value.length; }

/* ---------- render ---------- */
function pill(text) {
  const s = document.createElement('span');
  s.className = 'flag-pill';
  s.textContent = text;            // textContent — ไม่มีทางฝัง HTML ได้
  return s;
}

function renderResult(raw) {
  const t = T[lang];
  const r = engine.analyze(raw);
  const v = t.verdict[r.verdict];

  const box = document.createElement('div');
  box.className = 'verdict ' + r.verdict;

  const top = document.createElement('div');
  top.className = 'verdict-top';
  const h = document.createElement('h2');
  h.textContent = v.title;
  const chip = document.createElement('span');
  chip.className = 'risk-chip';
  chip.textContent = v.chip;
  top.append(h, chip);
  box.appendChild(top);

  const body = document.createElement('p');
  body.textContent = v.body;
  box.appendChild(body);

  if (r.scamSignals.length) {
    const d = document.createElement('div');
    d.className = 'flags';
    const b = document.createElement('b');
    b.textContent = t.redFlags;
    d.appendChild(b);
    r.scamSignals.forEach(s => d.appendChild(pill(r.categoryLabel(s.cat, lang))));
    if (r.untrustedDomains.length) d.appendChild(pill(r.untrustedDomains.join(', ')));
    box.appendChild(d);
  }
  if (r.legitSignals.length) {
    const d = document.createElement('div');
    d.className = 'flags';
    const b = document.createElement('b');
    b.textContent = t.safeSignals;
    d.appendChild(b);
    r.legitSignals.forEach(s => d.appendChild(pill(r.categoryLabel(s.cat, lang))));
    box.appendChild(d);
  }

  const st = document.createElement('div');
  st.className = 'strength';
  const dots = { low: '●○○', medium: '●●○', high: '●●●' }[r.strength];
  st.textContent = t.strength + ': ' + t.strengthWord[r.strength];
  const dotSpan = document.createElement('span');
  dotSpan.className = 'dots';
  dotSpan.textContent = dots;
  st.appendChild(dotSpan);
  box.appendChild(st);

  const tip = document.createElement('div');
  tip.className = 'action-tip';
  tip.textContent = t.tip[r.verdict];
  box.appendChild(tip);

  if (REPORT_FORM_URL) {
    const rw = document.createElement('div');
    rw.className = 'report-wrong';
    rw.textContent = t.reportWrong + ' ';
    const a = document.createElement('a');
    a.href = REPORT_FORM_URL + (REPORT_FORM_URL.includes('?') ? '&' : '?') + 'msg=' + encodeURIComponent(raw.slice(0, 400));
    a.target = '_blank';
    a.rel = 'noopener';
    a.textContent = t.reportWrongLink;
    rw.appendChild(a);
    box.appendChild(rw);
  }

  const out = $('result');
  out.innerHTML = '';
  out.appendChild(box);

  checkHistory.unshift({ msg: raw.slice(0, 60), cls: r.verdict });
  if (checkHistory.length > 8) checkHistory.pop();
  renderHistory();
}

function renderHistory() {
  const list = $('historyList');
  list.innerHTML = '';
  if (!checkHistory.length) {
    const e = document.createElement('div');
    e.className = 'empty-history';
    e.textContent = T[lang].emptyHistory;
    list.appendChild(e);
    return;
  }
  checkHistory.forEach(h => {
    const row = document.createElement('div');
    row.className = 'history-item';
    const p = document.createElement('span');
    p.className = 'msg-preview';
    p.textContent = h.msg;         // textContent — ปิดช่อง XSS ของ v0.3
    const tag = document.createElement('span');
    tag.className = 'history-tag ' + h.cls;
    tag.textContent = T[lang].verdict[h.cls].chip;
    row.append(p, tag);
    list.appendChild(row);
  });
}

function check() {
  if (!engine) return;
  const raw = $('msgInput').value.trim();
  if (!raw) {
    const t = T[lang];
    const box = document.createElement('div');
    box.className = 'verdict unsure';
    const h = document.createElement('h2'); h.textContent = '? ' + t.empty;
    const p = document.createElement('p'); p.textContent = t.emptyBody;
    box.append(h, p);
    $('result').innerHTML = '';
    $('result').appendChild(box);
    return;
  }
  renderResult(raw);
}

/* ---------- OCR: อ่านข้อความจากภาพ ----------
   โหลด Tesseract เฉพาะตอนผู้ใช้เลือกภาพจริง ๆ (lazy) เพื่อไม่ให้คนที่ไม่ใช้ต้องโหลดไฟล์หนัก
   ภาพไม่ถูกอัปโหลดไปที่ใด ประมวลผลในเบราว์เซอร์ทั้งหมด เหมือนส่วนอื่นของเครื่องมือนี้ */
let tesseractLoading = null;

function ocrSay(msg, isErr) {
  const el = $('ocrStatus');
  el.textContent = msg || '';
  el.className = 'ocr-status' + (isErr ? ' err' : '');
}

function ocrProgress(p) {
  const bar = $('ocrBar');
  if (p == null) { bar.style.display = 'none'; return; }
  bar.style.display = 'block';
  $('ocrFill').style.width = Math.round(p * 100) + '%';
}

function loadTesseract() {
  if (window.Tesseract) return Promise.resolve(window.Tesseract);
  if (tesseractLoading) return tesseractLoading;
  tesseractLoading = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = OCR.cdn;
    if (OCR.cdnIntegrity) { s.integrity = OCR.cdnIntegrity; s.crossOrigin = 'anonymous'; }
    // กันกรณี CDN ค้างไม่ตอบ ซึ่งจะไม่ยิงทั้ง onload และ onerror
    const timer = setTimeout(() => { s.remove(); reject(new Error('timeout')); }, 30000);
    s.onload = () => { clearTimeout(timer); window.Tesseract ? resolve(window.Tesseract) : reject(new Error('no global')); };
    s.onerror = () => { clearTimeout(timer); s.remove(); reject(new Error('script failed')); };
    document.head.appendChild(s);
  }).catch(err => {
    tesseractLoading = null;   // ล้างทิ้งเพื่อให้กดลองใหม่ได้
    throw err;
  });
  return tesseractLoading;
}

/** ย่อภาพก่อนส่ง — ลดขนาด payload และตรงกับขนาดที่โมเดลถูกฝึกมา */
function imageToDataUrl(file, maxDim) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
      const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/png'));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('อ่านไฟล์ภาพไม่ได้')); };
    img.src = url;
  });
}

async function ocrViaProxy(file, t) {
  ocrSay(t.ocrSending);
  ocrProgress(0.3);
  const dataUrl = await imageToDataUrl(file, OCR.maxDim);

  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), OCR.timeoutMs);
  try {
    const res = await fetch(OCR.proxyUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image: dataUrl }),
      signal: ctrl.signal
    });
    ocrProgress(0.9);
    const json = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(json.error || ('HTTP ' + res.status));
    return (json.text || '').trim();
  } finally {
    clearTimeout(timer);
  }
}

async function ocrViaTesseract(file, t) {
  ocrSay(t.ocrLoading);
  ocrProgress(0);
  const Tess = await loadTesseract();
  ocrSay(t.ocrReading);
  const { data } = await Tess.recognize(file, OCR.langs, {
    logger: m => { if (m.status === 'recognizing text') ocrProgress(m.progress); }
  });
  return (data.text || '').replace(/[ \t]+\n/g, '\n').trim();
}

async function runOcr(file) {
  const t = T[lang];
  if (!file || !file.type.startsWith('image/')) { ocrSay(t.ocrNotImage, true); return; }

  const useProxy = Boolean(OCR.proxyUrl);
  $('ocrPick').disabled = true;
  $('ocrNote').style.display = 'block';
  $('ocrNote').textContent = useProxy ? t.ocrPrivacyCloud : t.ocrNote;

  try {
    const text = useProxy ? await ocrViaProxy(file, t) : await ocrViaTesseract(file, t);
    ocrProgress(null);
    if (!text) { ocrSay(t.ocrEmpty, true); return; }

    $('msgInput').value = text;
    updateCount();
    ocrSay(t.ocrDone);
    $('msgInput').focus();
  } catch (err) {
    ocrProgress(null);
    const base = useProxy ? t.ocrProxyFail : t.ocrFail;
    ocrSay(base + ' (' + (err.name === 'AbortError' ? 'timeout' : err.message) + ')', true);
  } finally {
    $('ocrPick').disabled = false;
  }
}

$('ocrPick').addEventListener('click', () => $('ocrFile').click());
$('ocrFile').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; runOcr(f); });

const zone = $('ocrZone');
['dragenter', 'dragover'].forEach(ev => zone.addEventListener(ev, e => { e.preventDefault(); zone.classList.add('drag'); }));
['dragleave', 'drop'].forEach(ev => zone.addEventListener(ev, e => { e.preventDefault(); zone.classList.remove('drag'); }));
zone.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) runOcr(f); });

document.addEventListener('paste', e => {
  const item = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/'));
  if (!item) return;                    // วางข้อความธรรมดา ปล่อยให้ textarea ทำงานตามปกติ
  e.preventDefault();
  runOcr(item.getAsFile());
});

/* ---------- events (addEventListener ทั้งหมด ไม่มี inline onclick) ---------- */
$('btnEn').addEventListener('click', () => { lang = 'en'; applyLang(); });
$('btnTh').addEventListener('click', () => { lang = 'th'; applyLang(); });
$('msgInput').addEventListener('input', updateCount);
$('checkBtn').addEventListener('click', check);
$('clearBtn').addEventListener('click', () => {
  $('msgInput').value = '';
  updateCount();
  $('result').innerHTML = '';
});

applyLang();
updateCount();
})();

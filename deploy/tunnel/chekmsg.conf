# nginx ชั้นในของ ChekMsg — เสิร์ฟไฟล์ static อย่างเดียว ไม่รับ TLS
#
# วางที่ /etc/nginx/conf.d/default.conf ใน container (ดู docker-compose.yml ข้าง ๆ)
# TLS จบที่ Cloudflare แล้ว container นี้จึงฟังแค่ 80 และไม่ publish พอร์ตออกเครื่อง
# cloudflared คุยกับมันผ่าน docker network เท่านั้น
#
# กับดักของ nginx: add_header ใน location block จะล้าง header ที่สืบทอดมาจาก
# server block ทั้งหมด ถ้าเขียน `location = /patterns.json { add_header Cache-Control ...; }`
# ไฟล์นั้นจะไม่มี CSP และไม่มี nosniff ทันทีโดยไม่มีอะไรเตือน
# เลี่ยงด้วย map แล้วเรียก add_header ที่ระดับ server ที่เดียว
map $uri $chekmsg_cache {
	default          "public, max-age=3600";
	"/"              "public, max-age=0, must-revalidate";
	"/index.html"    "public, max-age=0, must-revalidate";
	"/patterns.json" "public, max-age=0, must-revalidate";
	"/engine.js"     "public, max-age=0, must-revalidate";
}

server {
	listen 80;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;
	server_tokens off;

	# Cloudflare บีบอัดให้อยู่แล้ว แต่เปิดที่ต้นทางด้วยเผื่อ cache miss
	# 80 KB เทียบกับ 21 KB ต่างกันเกือบ 4 เท่า
	gzip on;
	gzip_min_length 512;
	gzip_types text/plain text/javascript application/javascript application/json image/svg+xml;

	# HSTS ไม่ต้องตั้งที่นี่ — Cloudflare ตั้งให้ที่ edge (เปิดใน SSL/TLS → Edge Certificates)
	# ตั้งซ้ำสองที่แล้วแก้ยากเวลาต้องเปลี่ยน
	add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' blob: https://cdn.jsdelivr.net; worker-src blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://cdn.jsdelivr.net https://tessdata.projectnaptha.com; form-action 'none'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "no-referrer" always;
	add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
	add_header Cache-Control $chekmsg_cache always;

	# ทั้งรีโปถูก clone ลง web root จึงต้องปิดสิ่งที่ไม่ควรเปิดสาธารณะ
	# หน้า admin เข้าผ่าน SSH tunnel แทน (ดู docs/deploy-vps.md ข้อ 9)
	location ~ ^/(admin\.html|tests/|docs/|tools/|deploy/|ocr-proxy/|\.git|CLAUDE\.md|package(-lock)?\.json|build\.js|test-core\.js) {
		return 404;
	}

	location / {
		try_files $uri $uri/ =404;
	}
}

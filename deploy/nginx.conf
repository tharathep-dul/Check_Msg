# ChekMsg — nginx + Cloudflare (proxied)
#
# วางที่ /etc/nginx/sites-available/chekmsg แล้ว symlink ไป sites-enabled
# ต้องรัน deploy/cloudflare-ufw.sh ก่อน เพื่อสร้าง /etc/nginx/conf.d/cloudflare-realip.conf
# วิธีติดตั้งทั้งหมดอยู่ใน docs/deploy-vps.md
#
# แทนที่ chekmsg.example.com ด้วยโดเมนจริงก่อนใช้

# กับดักของ nginx: add_header ใน location block จะล้าง header ที่สืบทอดมาจาก server
# block ทั้งหมด ถ้าเขียน `location = /patterns.json { add_header Cache-Control ...; }`
# ไฟล์นั้นจะไม่มี CSP และไม่มี nosniff ทันทีโดยไม่มีอะไรเตือน
# เลี่ยงด้วย map แล้วใช้ add_header ที่ระดับ server ที่เดียว
map $uri $chekmsg_cache {
	default          "public, max-age=3600";
	"/"              "public, max-age=0, must-revalidate";
	"/index.html"    "public, max-age=0, must-revalidate";
	"/patterns.json" "public, max-age=0, must-revalidate";
	"/engine.js"     "public, max-age=0, must-revalidate";
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name chekmsg.example.com;

	# Cloudflare Origin Certificate — อายุ 15 ปี ไม่ต้องต่ออายุ
	# ต้องตั้ง SSL/TLS mode ใน Cloudflare เป็น "Full (strict)" ให้ตรงกัน
	ssl_certificate     /etc/ssl/cloudflare/origin.pem;
	ssl_certificate_key /etc/ssl/cloudflare/origin.key;
	ssl_protocols       TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers off;

	root /var/www/chekmsg;
	index index.html;

	server_tokens off;

	# Cloudflare บีบอัดให้อยู่แล้ว แต่ต้องเปิดตรงนี้ด้วยเผื่อ cache miss
	# และเผื่อวันหนึ่งปิด proxy — 80 KB เทียบกับ 21 KB ต่างกันเกือบ 4 เท่า
	gzip on;
	gzip_min_length 512;
	gzip_proxied any;
	gzip_types text/plain text/javascript application/javascript application/json image/svg+xml;

	add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' blob: https://cdn.jsdelivr.net; worker-src blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://cdn.jsdelivr.net https://tessdata.projectnaptha.com; form-action 'none'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'" always;
	add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "no-referrer" always;
	add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
	add_header Cross-Origin-Opener-Policy "same-origin" always;
	add_header Cache-Control $chekmsg_cache always;

	# ไฟล์ที่ไม่ควรเปิดสาธารณะ (หน้า admin เข้าผ่าน SSH tunnel — ดูคู่มือ)
	location ~ ^/(admin\.html|tests/|docs/|tools/|deploy/|\.git|package(-lock)?\.json|build\.js|test-core\.js) {
		return 404;
	}

	# OCR proxy อยู่โดเมนเดียวกัน จึงเป็น same-origin — ไม่ต้องแก้ CSP ไม่มี CORS preflight
	location /ocr/ {
		proxy_pass http://127.0.0.1:8787/;
		proxy_http_version 1.1;
		proxy_set_header Host              $host;
		# $remote_addr เป็น IP จริงของผู้ใช้แล้ว เพราะ real_ip module อ่านจาก
		# CF-Connecting-IP (ตั้งใน conf.d/cloudflare-realip.conf) ถ้าไม่มีบรรทัดนี้
		# ocr-proxy จะเห็นทุกคำขอมาจาก 127.0.0.1 แล้วการจำกัดอัตราต่อ IP จะไร้ผล
		proxy_set_header X-Forwarded-For   $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 120s;
		# ภาพ base64 ที่ 6 MB จะพองเป็น ~8 MB ใน JSON — ต้องมากกว่า MAX_IMAGE_MB
		client_max_body_size 12m;
	}

	location / {
		try_files $uri $uri/ =404;
	}
}

server {
	listen 80;
	listen [::]:80;
	server_name chekmsg.example.com;
	return 301 https://$host$request_uri;
}
